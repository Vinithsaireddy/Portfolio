<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luke Baffait.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0a0a;
    font-family: 'Inter', sans-serif;
    color: #f0f0f0;
  }

  .bg {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(255,30,0,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 30% 70%, rgba(255,59,20,0.06) 0%, transparent 55%),
                #0a0a0a;
    z-index: 0;
  }

  .tagline {
    position: absolute;
    top: 48px;
    left: 48px;
    font-size: 14px;
    font-weight: 400;
    color: rgba(240,240,240,0.7);
    line-height: 1.5;
    z-index: 1;
  }
  .tagline em {
    font-style: italic;
    color: rgba(240,240,240,0.85);
  }

  .name-left {
    position: absolute;
    bottom: 72px;
    left: 32px;
    font-family: 'Inter', sans-serif;
    font-weight: 900;
    font-size: 22vw;
    line-height: 1;
    color: #e8e8e0;
    z-index: 1;
    white-space: nowrap;
  }

  .name-right {
    position: absolute;
    bottom: 72px;
    right: 24px;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-style: italic;
    font-size: 22vw;
    line-height: 1;
    color: #8ff0e0;
    z-index: 1;
    white-space: nowrap;
  }

  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 64px;
    display: flex;
    align-items: center;
    z-index: 2;
  }

  .bottom-nav::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: rgba(255,255,255,0.12);
  }

  .nav-left {
    position: absolute;
    left: 32px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(240,240,240,0.6);
  }

  .nav-center {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(240,240,240,0.6);
  }

  .nav-right {
    position: absolute;
    right: 32px;
    display: flex;
    gap: 32px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(240,240,240,0.6);
  }

  @media (max-width: 768px) {
    .tagline { top: 24px; left: 24px; font-size: 12px; }
    .name-left { left: 16px; font-size: 18vw; bottom: 68px; }
    .name-right { right: 12px; font-size: 18vw; bottom: 68px; }
    .nav-left { left: 16px; font-size: 10px; }
    .nav-center { font-size: 10px; }
    .nav-right { right: 16px; gap: 16px; font-size: 10px; }
  }
</style>
</head>
<body>
  <div class="bg"></div>

  <div class="tagline">
    Creative <em>Developer</em><br>
    Los Angeles, CA
  </div>

  <span class="name-left">Luke</span>
  <span class="name-right">Baffait.</span>

  <nav class="bottom-nav">
    <div class="nav-left">V3.0</div>
    <div class="nav-center">BEHANCE &nbsp;/&nbsp; LINKEDIN &nbsp;/&nbsp; GITHUB</div>
    <div class="nav-right">
      <span>WORK</span>
      <span>INFO</span>
      <span>CONTACT</span>
    </div>
  </nav>
</body>
</html>
